# Render Blueprint: New → Blueprint → pick this repo. Creates Postgres + the web app.
databases:
  - name: smartmove-db
    plan: basic-256mb
    databaseName: smartmove
    user: smartmove

services:
  - type: web
    name: smartmove
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: smartmove-db, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smartmove.onrender.com
      - key: SEED_DEMO_DATA
        value: "false"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
