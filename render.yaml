# Render Blueprint: New → Blueprint → pick this repo. Creates Postgres + the web app.
# Frankfurt is Render's closest region to Kenya; the app and database must share a region.
databases:
  - name: kingmoverskenya-db
    plan: basic-256mb
    region: frankfurt
    databaseName: kingmoverskenya
    user: kingmoverskenya

services:
  - type: web
    name: kingmoverskenya
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: kingmoverskenya-db, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kingmoverskenya.onrender.com
      - key: SEED_DEMO_DATA
        value: "false"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
